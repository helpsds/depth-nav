# 基础配置
project_name: da3_nav_train
run_name: da3_legacy_mod_unfreeze1_gpu7

# 数据
use_wandb: True # set to false if you don't want to log to wandb
train: True
batch_size: 100
epochs: 30
gpu_ids: [7] 
num_workers: 12
lr: 1e-4 # 降低学习率，从1e-4改为3e-5
optimizer: adamw
clipping: True
max_norm: 1.0
scheduler: "cosine"
warmup: True 
warmup_epochs: 4
seed: 0

image_size: [85, 64]
goal_type: "image"
context_type: "temporal"
clip_goals: False




# 模型（核心）
model_type: da3
obs_encoding_size: 512
nav_fusion_mode: "legacy_depth"  # vint_like 或 legacy_depth（旧的深度/交叉注意力架构）
da3_unfreeze_last_blocks: 1   # 从DA3 backbone最后开始解冻的block数量；建议按 0,1,2,3... 做消融
da3_unfreeze_norm: True
da3_backbone_lr: 1e-5         # 解冻backbone block时使用的小学习率

context_size: 5
len_traj_pred: 5
learn_angle: True
mha_num_attention_heads: 4
mha_num_attention_layers: 4
mha_ff_dim_factor: 4

# 训练超参
eval_batch_size: 100

normalize: True  # 禁用归一化，避免action标签被放大


alpha: 0.5 # 提高alpha值，让dist_loss占更大比重，减少action_loss的影响
# # 日志
# print_log_freq: 10
# image_log_freq: 100
# num_images_log: 8
# eval_fraction: 0.1
# eval_freq: 1

# Enable DA3 preprocessing instead of default resize/crop
use_da3_preprocessing: True
da3_process_res: 224
da3_process_res_method: "upper_bound_resize"  # Options: upper_bound_resize, upper_bound_crop, lower_bound_resize, lower_bound_crop
da3_num_workers: 1  # Keep as 1 for DataLoader compatibility
load_original_images: False  # skip extra original-image loading for visualization
# 数据集（沿用你原有的数据集路径）
