# 距离/动作配置
distance:
  min_dist_cat: 0
  max_dist_cat: 20
action:
  min_dist_cat: 0
  max_dist_cat: 10
close_far_threshold: 10 # distance threshold used to seperate the close and the far  subgoals that are sampled per datapoint



# logging stuff
## =0 turns off
print_log_freq: 100 # in iterations
image_log_freq: 0 # disable image visualization/wandb image logging
num_images_log: 0 # disable visualization image generation
pairwise_test_freq: 20 # in epochs
eval_fraction: 0.05
wandb_log_freq: 10 # in iterations
eval_freq: 1 # in epochs
